<!--
  A geometric stand-in for a scanned document, used by the FileUpload stories
  to exercise the "image preview" branch.

  Deliberately not a passport, real or invented: a mock-up of an identity
  document is a fabricated record, and one that looked convincing would be
  worse than one that did not. This is a page with some lines on it.

  The colours are teal-700 and teal-200 copied from the palette; they live here
  rather than in the story because this is an image asset, and an image's own
  colours are not design tokens.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <rect width="96" height="96" fill="#0D625B" />
  <rect x="18" y="14" width="60" height="68" rx="4" fill="#C7E5E2" />
  <rect x="26" y="24" width="20" height="24" rx="2" fill="#0D625B" />
  <rect x="52" y="26" width="18" height="4" rx="2" fill="#0D625B" />
  <rect x="52" y="36" width="18" height="4" rx="2" fill="#0D625B" />
  <rect x="26" y="56" width="44" height="4" rx="2" fill="#0D625B" />
  <rect x="26" y="66" width="34" height="4" rx="2" fill="#0D625B" />
</svg>
